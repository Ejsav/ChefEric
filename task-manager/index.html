<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A focused task list that keeps your tasks in this browser." />
    <title>Tasks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317181b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="tasks.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#task-list-heading">Skip to tasks</a>

    <div class="shell">
      <header class="masthead">
        <div class="masthead__title">
          <h1>Tasks</h1>
          <p class="masthead__tagline">Capture it, rank it, finish it.</p>
        </div>
        <ul class="stats" aria-label="Task counts">
          <li class="stats__item"><span class="stats__value" id="count-total">0</span> <span class="stats__label">Total</span></li>
          <li class="stats__item"><span class="stats__value" id="count-active">0</span> <span class="stats__label">Active</span></li>
          <li class="stats__item"><span class="stats__value" id="count-completed">0</span> <span class="stats__label">Completed</span></li>
        </ul>
      </header>

      <!-- Storage problems: filled by app.js only when something is wrong. -->
      <div id="storage-alert" class="notice notice--warning" role="alert" hidden></div>
      <div id="load-notice" class="notice notice--info" hidden>
        <p id="load-notice-text"></p>
        <button type="button" class="button button--quiet button--small" id="load-notice-dismiss">Dismiss</button>
      </div>

      <main>
        <section class="panel" aria-labelledby="new-task-heading">
          <h2 id="new-task-heading" class="visually-hidden">New task</h2>
          <form id="new-task-form" class="new-task" novalidate autocomplete="off">
            <div class="field field--grow">
              <label class="field__label" for="new-task-title">Task</label>
              <input
                id="new-task-title"
                name="title"
                class="input"
                type="text"
                maxlength="200"
                placeholder="What needs doing?"
                aria-describedby="new-task-error new-task-hint"
                required
              />
            </div>
            <div class="field">
              <label class="field__label" for="new-task-priority">Priority</label>
              <select id="new-task-priority" name="priority" class="input select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <button type="submit" class="button button--primary new-task__submit">Add task</button>
            <p id="new-task-error" class="field__error" hidden></p>
            <p id="new-task-hint" class="field__hint" hidden></p>
          </form>
        </section>

        <section class="panel panel--list" aria-labelledby="task-list-heading">
          <div class="toolbar">
            <h2 id="task-list-heading" class="toolbar__heading" tabindex="-1">Your tasks</h2>
            <div class="toolbar__filters">
              <fieldset class="segmented">
                <legend class="visually-hidden">Show tasks by status</legend>
                <label class="segmented__option">
                  <input type="radio" name="status" value="all" checked />
                  <span>All <span class="segmented__count" data-count="total">0</span></span>
                </label>
                <label class="segmented__option">
                  <input type="radio" name="status" value="active" />
                  <span>Active <span class="segmented__count" data-count="active">0</span></span>
                </label>
                <label class="segmented__option">
                  <input type="radio" name="status" value="completed" />
                  <span>Completed <span class="segmented__count" data-count="completed">0</span></span>
                </label>
              </fieldset>
              <div class="field field--inline">
                <label class="field__label" for="priority-filter">Priority</label>
                <select id="priority-filter" class="input select select--compact">
                  <option value="all">All priorities</option>
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>
          </div>

          <p id="showing" class="showing"></p>
          <ul id="task-list" class="task-list" aria-labelledby="task-list-heading"></ul>

          <div id="empty-state" class="empty" hidden>
            <p class="empty__title" id="empty-title"></p>
            <p class="empty__body" id="empty-body"></p>
            <button type="button" class="button button--quiet" id="empty-reset" hidden>Show all tasks</button>
          </div>
        </section>
      </main>

      <footer class="footnote">
        <p>Tasks are saved in this browser only. Nothing is sent anywhere.</p>
      </footer>
    </div>

    <!-- Undo bar for the last deleted task. -->
    <div id="undo-bar" class="undo-bar" hidden>
      <p id="undo-text" class="undo-bar__text"></p>
      <button type="button" class="button button--inverse button--small" id="undo-button">Undo</button>
      <button type="button" class="undo-bar__close" id="undo-close" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Screen-reader announcements for actions. -->
    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <template id="task-template">
      <li class="task">
        <div class="task__main">
          <input type="checkbox" class="task__check" data-role="toggle" />
          <label class="task__title"></label>
        </div>
        <span class="priority" data-priority="medium">
          <span class="priority__bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="priority__label"></span><span class="visually-hidden"> priority</span>
        </span>
        <div class="task__actions">
          <button type="button" class="button button--quiet button--small" data-role="edit">Edit</button>
          <button type="button" class="button button--danger button--small" data-role="delete">Delete</button>
        </div>
      </li>
    </template>

    <template id="edit-template">
      <li class="task task--editing">
        <form class="edit-form" novalidate autocomplete="off">
          <div class="field field--grow">
            <label class="field__label" data-for="title">Title</label>
            <input type="text" class="input" maxlength="200" data-role="edit-title" required />
          </div>
          <div class="field">
            <label class="field__label" data-for="priority">Priority</label>
            <select class="input select" data-role="edit-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="edit-form__actions">
            <button type="submit" class="button button--primary button--small" data-role="save">Save</button>
            <button type="button" class="button button--quiet button--small" data-role="cancel">Cancel</button>
          </div>
          <p class="field__error" data-role="edit-error" hidden></p>
        </form>
      </li>
    </template>

    <noscript>
      <p class="notice notice--warning noscript">This task list needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
